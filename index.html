<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4</title>
  
    </head>
    <body>

            <table border="1" cellpading="10" cellspacing="0">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Hobby</th>
                    </tr>
                </thead>
            <tbody>
                <tr>
                    <td style="color: rgb(231, 131, 0);">Miguel</td>
                    <td style="color: rgb(231, 131, 0);">14</td>
                    <td style="color: rgb(231, 131, 0);">Andar a cavalo</td>
                </tr>
                <tr>
                    <td style="color: blue;">Lucas Apoolo</td>
                    <td style="color: blue;">14</td>
                    <td style="color: blue;">Codar</td>
                </tr>
                <tr>
                    <td style="color: rgb(30, 255, 0);">Kaua</td>
                    <td style="color: rgb(30, 255, 0);">16</td>
                    <td style="color: rgb(30, 255, 0);">Jogar games</td>
                </tr>
                <tr>
                    <td style="color: brown;">Bernardo</td>
                    <td style="color: brown;">14</td>
                    <td style="color: brown;">Jogar futebol</td>
                </tr>
                <tr>
                    <td style="color: blueviolet;">Erick</td>
                    <td style="color: blueviolet;">15</td>
                    <td style="color: blueviolet;">Academia</td>
                </tr>
            </tbody>
            </table>

            <form action="#" method="post">

                <label for="nome">Nome:</label>
                <br><br>
                <input type="text" id="name" placeholder="Seu Nome Aqui.." required pattern="{2,}">
                <br><br>
                <label for="email" >E-mail:</label>
                <br><br>
                <input type="email" id="email" placeholder="Seu E-mail Aqui.." required pattern="{10,}">
                <br><br>
                <label for="senha" style="color: rgb(255, 81, 0);">Senha:</label>
                <br><br>
                <input type="password" id="senha" placeholder="Sua Senha Aqui.." required>
                <br><br>
                <label for="cidade">Cidade:</label>
                <br><br>
                <select name="cidade" id="cidade">
                    <option value="">Selecione</option>
                    <option value="nh">Novo Hamburgo</option>
                    <option value="sl">São Paulo</option>
                    <option value="cb">Rio de Janeiro</option>
                    <option value="mgo">Montenegro</option>
                </select>
                <br><br>
                <label for="number">Telefone:</label>
                <br><br>
                <input type="tel" id="telefone" placeholder="(51) 99999 9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
                <br><br>
                <label for="cor">Cor Favorita:</label>
                <br><br>
                <input type="color" id="cor" value="3498db">
                <br><br>
                <button type="submit">Enviar</button>

            </form>
        
    </body>
</html>
