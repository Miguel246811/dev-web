<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3</title>
  
    </head>
    <body>

       <form action="#" method="post">

        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome.." required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="seuemail@email.com"> 
        <br><br>
        <label for="senha">Sua senha:</label>
        <input type="password" id="senha" placeholder="Sua senha" required>
        <br><br>
        <label for="mensagem">Mensagem:</label>
        <textarea name="mensagem" id="mensagem" cols="30" rows="10" placeholder="Escreva aqui.."></textarea>
        <br><br>
        <label for="cidade">Cidade</label>
        <select name="cidade" id="cidade">
            <option value="">Selecione..</option>
            <option value="nh">Novo Hamburguer</option>
            <option value="sl">São Leopoldo</option>
            <option value="cb">Campo Bom</option>
            <option value="mgo">Montenegro</option>
        </select>
        <fieldset>
                <legend>Gênero:</legend>
                <input type="radio" id="masc" name="genero" value="M">
                <label for="masc">Masculino</label>
                <input type="radio" id="fem" name="genero" value="F">
                <label for="fem">Feminino</label>
        </fieldset>

       </form>
        
    </body>
</html>
