<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula com CSS</title>
    <link rel="stylesheet" href="/style.css">
    
   

    </head>
    <body>

        <h1>Cadastro de alunos</h1>
        <h2>Alunos cadastrados</h2>
        <br><br>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Curso</th>
                    <th>Idade</th>
                    <th>Cidade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Lucas Apollo</td>
                    <td>Desemvolvedor de sistemas</td>
                    <td>14</td>
                    <td>Novo Hamburgo</td>
                </tr>
                <tr>
                    <td>Erick Gabriel</td>
                    <td>Imformática</td>
                    <td>16</td>
                    <td>São Leopoldo</td>
                </tr>
                <tr>
                    <td>Maria Antônia</td>
                    <td>Exel</td>
                    <td>16</td>
                    <td>Campo Bom</td>
                </tr>
                <tr>
                    <td>Bernardo Machado</td>
                    <td>Exel</td>
                    <td>89</td>
                    <td>Sapucaia</td>
                </tr>
            </tbody>
        </table>

        <h2>Novos Cadastros</h2>
        <form action="#" method="post">
            
            <label for="nome">Nomes Completos</label>
            <br><br>
            <input type="text" id="nome" placeholder="Digite seu nome">
            <br><br>

            <label for="email">Digite seu email</label>
            <br><br>
            <input type="text" id="email" placeholder="Digite seu nome">
            <br><br>

            <label for="Idade">Idade</label>
            <br><br>
            <input type="text" id="Idade" placeholder="Digite sua idade">
            <br><br>

            <label for="curso">Escolha seu curso</label>
            <select name="curso" id="curso">
                    <option value="">Selecione um curso</option>
                    <option value="informática">Informática</option>
                    <option value="exel">Exel</option>
                    <option value="desenvolvimento de sistema"></option>
            </select>
            <br><br>
            <label for="mensagem">Observações</label>
            <textarea id="mensagem" rows="4">Digite alguma observação</textarea>

            <button type="submit">cadastrar</button>
            
        </form>

    </body>
</html>
