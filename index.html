<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3</title>
  
    </head>
    <body>

       <form action="#" method="post">

       <label for="nome">Nome</label>
       <br><br>
       <input type="text" id="nome" placeholder="Seu nome completo">
       <br><br>
       <label for="email">E-mail:</label>
       <br><br>
       <input type="email" id="email" placeholder="seuemail@email.com">
       <br><br>
       <label for="senha">senha (min 6, só letras e números):</label>
       <input type="password" id="senha" pattern="[a-zA-z0-9]{6,}" placeholder="Mínimo 6 caracteres.." required>
       <br><br>
       <label for="idade">Idade (13 a 99):</label>
       <br><br>
       <input type="number" id="idade" min="13" max="99" required>
       <br><br>
       <label for="data">Data (só em 2026):</label>
       <br><br>
       <input type="date" id="data" min="2026-01-01" max="2026-12-31">
       <br><br>
       <label for="telefone">Telefone</label>
       <br><br>
       <input type="tel" id="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(51) 99999-9999">
       <br><br>
       <label for="nota">Nota (0 a 10):</label>
       <br><br>
       <input type="range" id="nota" min="0" max="10" value="7">
       <br><br>
       <label for="cor">Cor favorita</label>
       <br><br>
       <input type="color" id="cor" value="#3498db">
       <br><br>
       <label for="codigo">Código (gerado automatico):</label>
       <br><br>
       <input type="text" id="codigo" value="ALU-2026-001" disabled>
       <br><br>
       <button type="submit">Enviar</button>
       <br><br>


        

      </form>
        
    </body>
</html>
